# FACE VALUE — настройки Cloudflare Worker.
# Секреты сюда НЕ пишутся. BOT_TOKEN и WEBHOOK_SECRET задаются только как секреты Cloudflare:
#   в веб-панели (Settings → Variables and Secrets → тип Secret) или командой npx wrangler secret put …
name = "face-value-api"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
# С какого сайта игре разрешено обращаться к серверу (только домен, без пути).
ALLOWED_ORIGIN = "https://creator83754504.github.io"
# Адрес игры — его открывает кнопка «Играть» в боте
WEBAPP_URL = "https://creator83754504.github.io/face-value/"
# Сколько секунд initData считается свежей
INIT_DATA_MAX_AGE = "86400"

[[d1_databases]]
binding = "DB"
database_name = "face-value-db"
database_id = "7a45a83a-587c-42d0-a879-4275322aed4d"